<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VM-Tipset 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body class="bg-zinc-950 text-white min-h-screen">

<div id="start-page" class="min-h-screen flex items-center justify-center p-6">

<div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-8">

<h1 class="text-5xl font-bold text-center mb-8">
⚽ VM-Tipset 2026
</h1>

<div class="flex gap-3 mb-6">

<button id="login-tab"
class="flex-1 bg-white text-black py-3 rounded-2xl font-bold">
Logga in
</button>

<button id="register-tab"
class="flex-1 bg-zinc-800 text-white py-3 rounded-2xl font-bold">
Skapa konto
</button>

</div>

<form id="login-form" class="space-y-4">

<input
type="email"
placeholder="E-post"
required
class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"
/>

<input
type="password"
placeholder="Lösenord"
required
class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"
/>

<button
type="submit"
class="w-full bg-white text-black py-4 rounded-2xl font-bold">
🔓 Logga in
</button>

</form>

<form id="register-form" class="space-y-4 hidden">

<input
type="text"
id="name"
placeholder="Namn"
required
class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"
/>

<input
type="email"
placeholder="E-post"
required
class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"
/>

<input
type="password"
placeholder="Lösenord"
required
class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4"
/>

<button
type="submit"
class="w-full bg-white text-black py-4 rounded-2xl font-bold">
🚀 Skapa konto
</button>

</form>

</div>
</div>

<div id="tips-page"
class="hidden min-h-screen p-6 max-w-7xl mx-auto">

<div class="flex justify-between items-center mb-10">

<h1 class="text-5xl font-bold">
⚽ Registrera ditt tips
</h1>

<button id="logout-btn"
class="bg-red-500 px-6 py-3 rounded-2xl font-bold">
🚪 Logga ut
</button>

</div>

<div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden overflow-x-auto">

<table class="w-full min-w-[900px]">

<thead class="bg-zinc-800">
<tr>
<th class="p-4 text-left">Datum</th>
<th class="p-4 text-left">Tid</th>
<th class="p-4 text-left">Match</th>
<th class="p-4 text-left">Tips</th>
<th class="p-4 text-left">Vinnare</th>
</tr>
</thead>

<tbody id="matches-body"></tbody>

</table>

</div>

<div class="text-center mt-10">

<button id="save-tip-btn"
class="bg-white text-black px-10 py-4 rounded-2xl font-bold">
💾 Registrera mitt tips
</button>

</div>

</div>

<script>

const supabaseUrl = 'DIN_SUPABASE_URL'
const supabaseKey = 'DIN_SUPABASE_ANON_KEY'

const sb = window.supabase.createClient(
supabaseUrl,
supabaseKey
)

const startPage = document.getElementById('start-page')
const tipsPage = document.getElementById('tips-page')

const loginTab = document.getElementById('login-tab')
const registerTab = document.getElementById('register-tab')

const loginForm = document.getElementById('login-form')
const registerForm = document.getElementById('register-form')

const logoutBtn = document.getElementById('logout-btn')
const saveTipBtn = document.getElementById('save-tip-btn')

const matchesBody = document.getElementById('matches-body')

let matches = []

loginTab.addEventListener('click', () => {

loginForm.classList.remove('hidden')
registerForm.classList.add('hidden')

})

registerTab.addEventListener('click', () => {

registerForm.classList.remove('hidden')
loginForm.classList.add('hidden')

})

async function loadMatches() {

try {

const response = await fetch(
'https://free-api-live-football-data.p.rapidapi.com/football-get-all-matches-by-league?leagueid=47',
{
method: 'GET',
headers: {
'X-RapidAPI-Key': 'DIN_RAPIDAPI_KEY',
'X-RapidAPI-Host': 'free-api-live-football-data.p.rapidapi.com'
}
}
)

const data = await response.json()

matches = data.data.slice(0, 10).map(match => ({

date: match.date || '-',
time: match.time || '-',

home: match.homeTeam?.name || match.homeTeam,
away: match.awayTeam?.name || match.awayTeam,

tipHomeScore: 0,
tipAwayScore: 0

}))

renderMatches()

} catch (err) {

console.error(err)

matchesBody.innerHTML = `
<tr>
<td colspan="5"
class="p-8 text-center text-red-400">
Kunde inte ladda matcher.
</td>
</tr>
`
}
}

function getWinner(match) {

if (match.tipHomeScore > match.tipAwayScore)
return match.home

if (match.tipAwayScore > match.tipHomeScore)
return match.away

return 'Oavgjort'
}

function renderMatches() {

matchesBody.innerHTML = ''

matches.forEach((match, index) => {

const winner = getWinner(match)

matchesBody.innerHTML += `
<tr class="border-t border-zinc-800">

<td class="p-4">${match.date}</td>

<td class="p-4">${match.time}</td>

<td class="p-4">
${match.home} - ${match.away}
</td>

<td class="p-4">

<div class="flex items-center gap-2">

<input
type="number"
min="0"
value="${match.tipHomeScore}"
class="w-16 bg-zinc-800 border border-zinc-700 rounded-xl p-2 text-center"
onchange="updateScore(${index}, 'home', this.value)"
/>

<span>-</span>

<input
type="number"
min="0"
value="${match.tipAwayScore}"
class="w-16 bg-zinc-800 border border-zinc-700 rounded-xl p-2 text-center"
onchange="updateScore(${index}, 'away', this.value)"
/>

</div>

</td>

<td class="p-4 text-green-400 font-bold">
${winner}
</td>

</tr>
`
})
}

function updateScore(index, team, value) {

matches[index][
'tip' +
team.charAt(0).toUpperCase() +
team.slice(1) +
'Score'
] = Number(value)

renderMatches()
}

loginForm.addEventListener('submit', async (e) => {

e.preventDefault()

const email =
loginForm.querySelector('input[type="email"]').value

const password =
loginForm.querySelector('input[type="password"]').value

const { error } =
await sb.auth.signInWithPassword({
email,
password
})

if (error) {
alert(error.message)
return
}

startPage.classList.add('hidden')
tipsPage.classList.remove('hidden')

})

registerForm.addEventListener('submit', async (e) => {

e.preventDefault()

const name =
document.getElementById('name').value

const email =
registerForm.querySelector('input[type="email"]').value

const password =
registerForm.querySelector('input[type="password"]').value

const { error } =
await sb.auth.signUp({

email,
password,

options: {
data: {
name
}
}
})

if (error) {
alert(error.message)
return
}

alert('Konto skapat!')

startPage.classList.add('hidden')
tipsPage.classList.remove('hidden')

})

saveTipBtn.addEventListener('click', async () => {

const {
data: { user }
} = await sb.auth.getUser()

for (const match of matches) {

await sb.from('tips').insert({

user_id: user.id,

match_name:
`${match.home} - ${match.away}`,

home_team: match.home,
away_team: match.away,

home_score: match.tipHomeScore,
away_score: match.tipAwayScore

})
}

alert('Tips sparade!')

})

logoutBtn.addEventListener('click', async () => {

await sb.auth.signOut()

tipsPage.classList.add('hidden')
startPage.classList.remove('hidden')

})

loadMatches()

</script>

</body>
</html>
